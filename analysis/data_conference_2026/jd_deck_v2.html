/* Slide: one real ad that says junior and asks for years. Says versus asks, then the ruler. Reused for the closing slide. */
function adRuler(parent, o) {
  const svg = s('svg', { viewBox: '0 0 1000 150', class: 'ruler' }, parent);
  const X = v => 70 + v * 143, z = o.zone;
  s('rect', { x: X(z[0]), y: 52, width: X(z[1]) - X(z[0]), height: 34, rx: 8, fill: C.soft }, svg);
  s('text', { x: X(z[0]), y: 40, class: 'lbl', text: o.zoneLabel }, svg);
  s('line', { x1: X(0), x2: X(6), y1: 69, y2: 69, stroke: C.ink, 'stroke-width': 2 }, svg);
  for (let i = 0; i <= 6; i++) {
    s('line', { x1: X(i), x2: X(i), y1: 60, y2: 78, stroke: C.ink, 'stroke-width': 2 }, svg);
    s('text', { x: X(i), y: 108, 'text-anchor': 'middle', class: 'tick', text: i + (i === 6 ? '+' : '') }, svg);
  }
  s('text', { x: X(6) + 20, y: 108, class: 'tick', text: 'years' }, svg);
  const rng_ = s('rect', { x: X(o.from), y: 56, width: 0, height: 26, rx: 13, fill: C.plum, opacity: .9 }, svg);
  const pin = s('g', { class: 'pin', style: { opacity: 0 } }, svg);
  s('path', { d: 'M0,0 L-13,-34 A18,18 0 1 1 13,-34 Z', fill: C.plum, transform: 'translate(0,66)' }, pin);
  s('circle', { cx: 0, cy: 32, r: 6.5, fill: C.bg }, pin);
  s('text', { x: X(o.from) + (X(o.to) - X(o.from)) / 2, y: 135, 'text-anchor': 'middle', class: 'ladnum2', text: o.label, style: { opacity: 0 } }, svg);
  const lab = svg.lastChild;
  return {
    async drop() {
      await tween(900, e => { pin.setAttribute('transform', `translate(${X(o.from)},${-150 * (1 - e)})`); pin.style.opacity = Math.min(1, e * 4); }, { ease: E.bounce });
      await tween(700, e => { rng_.setAttribute('width', (X(o.to) - X(o.from)) * e); lab.style.opacity = e; });
    }
  };
}
function buildAdSlide(stage, final) {

    h('div', { class: 'adline l2' }, h('span', { class: 'tag ask' }, 'ASKS'), h('span', { class: 'txt' })));
  stage.append(h('div', { class: 'col' }, card));

  L1.style.opacity = 0; L2.style.opacity = 0;
  const ruler = adRuler($('.col', stage), { zone: [0, 1], zoneLabel: 'a typical junior ad: about 1 year', from: 2, to: 5, label: 'this “junior” ad asks: 2 to 5 years' });
  $('.ruler', stage).style.opacity = 0;
  const hi = (el, word, cls) => { const t = el.textContent, i = t.indexOf(word); if (i < 0) return;
    el.innerHTML = t.slice(0, i) + `<mark class="${cls}">${word}</mark>` + t.slice(i + word.length); };
  const steps = [
    async () => { L1.style.opacity = 1; await typeText($('.txt', L1), A, 26); hi($('.txt', L1), 'Junior', 'm-say'); },
    async () => { L2.style.opacity = 1; await typeText($('.txt', L2), B, 16); hi($('.txt', L2), '2-5 years', 'm-ask'); },
    async () => { $('.ruler', stage).style.opacity = 1; await ruler.drop(); }

  if (final) steps.push(async () => { const f = h('div', { class: 'finalline' }, 'Read what it asks. ', h('em', {}, 'Answer with your own story.')); $('.col', stage).append(f);
    const q = h('a', { class: 'qr', href: QR.url, target: '_blank' }, h('div', { class: 'qrbox', html: `<svg viewBox="-2 -2 ${QR.size + 4} ${QR.size + 4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${QR.size + 4}" height="${QR.size + 4}" fill="#fff"/><path d="${QR.path}" fill="#000"/></svg>` }),
      h('div', { class: 'qrcap' }, 'Explore the ads yourself'), h('div', { class: 'qrurl' }, QR.url.replace(/^https:\/\//, '').replace(/\/(?=[^/]+$)/, '/\u200b')));
    stage.append(q); [f, q].forEach(el => el.style.opacity = 0);

  const LEFT = 70, RIGHT = 930, MID = 182, GAP = 7, CAP = 26, AXIS_Y = 292, TL = 518;
  const ink = (size, fill = C.ink2, weight = 500) => ({ fontSize: size + 'px', fill, fontWeight: weight });

  // per-ad position on the spectrum, and its group
  const X = T.x, placed = X.filter(v => v != null), lo = Math.min(...placed), hi = Math.max(...placed);

  const plain = i => T.ads[i][1].trim() === 'Analytics Engineer';
  const groups = Object.keys(T.names).map(c => ({ c, name: T.names[c], m: T.group_x[c] })).sort((a, b) => a.m - b.m);
  const palette = [C.blue, C.plum, C.teal, C.amber, C.ink2], colour = {};
  groups.forEach((g, k) => { g.col = colour[g.c] = palette[k]; });
  const stable = (T.stability[T.k] || {}).ari_mean >= 0.75;

  // dot-histogram columns; a full column spills into the nearest one with room
  const columns = Math.floor((RIGHT - LEFT) / GAP), height = new Array(columns + 1).fill(0), swarm = {};
  X.map((v, i) => [v, i]).filter(([v]) => v != null).sort((a, b) => a[0] - b[0]).forEach(([v, i]) => {
    const ideal = Math.round(frac(v) * columns);
    let col = ideal;
    for (let d = 0; d <= columns; d++) {
      const pick = [ideal + d, ideal - d].find(c => c >= 0 && c <= columns && height[c] < CAP);
      if (pick != null) { col = pick; break; }
    }
    const k = height[col]++;
    swarm[i] = [LEFT + col * GAP, MID + ((k + 1) >> 1) * GAP * (k % 2 ? -1 : 1)];
  });

  // 1. the cloud of titles
  const cloud = s('g', {}, svg);
  const dots = T.ads.map(([c], i) => {
    const el = s('circle', { cx: 0, cy: 0, r: 3, class: 'dot' }, cloud);
    el.style.transition = 'transform 1.4s cubic-bezier(.2,.8,.2,1), fill .6s, opacity .6s';
    return { el, i, c: String(c), x0: 40 + r() * (W - 80), y0: 105 + r() * 370, at: swarm[i] };
  });
  const big = s('text', { x: W / 2, y: 52, 'text-anchor': 'middle', class: 'bignum', text: '0', style: { transition: 'opacity .5s' } }, svg);
  const sub = s('text', { x: W / 2, y: 84, 'text-anchor': 'middle', text: `different job titles on ${T.n} analytics-engineer ads`,
    style: { ...ink(17), transition: 'opacity .5s' } }, svg);
  const off = new Set(T.off_title), seen = new Set();
  const pool = T.ads.map((a, i) => [a[1].trim(), T.ids[i]]).filter(([t, id]) => !off.has(id) && t !== 'Analytics Engineer' && t.length <= 34 && !/[\[\]\d]/.test(t) && !seen.has(t) && seen.add(t));
  const floaters = shuffle(pool, rng(3)).slice(0, 12).map(([t], k) => { const row = k >> 1, right = k & 1;
    const x = right ? 700 + (row % 2 ? -40 : 50) : 270 + (row % 2 ? 80 : -30);
    return s('text', { x, y: 132 + row * 68, 'text-anchor': 'middle', text: t, 'paint-order': 'stroke', stroke: C.bg, 'stroke-width': 6,
      style: { ...ink(16), opacity: 0, transition: 'opacity .5s' } }, svg); });

  // 2. the outside mark: a timeline stub
  const line = layer();
  s('text', { x: 40, y: TL, text: '2019', style: ink(17, C.ink, 700) }, line);
  s('circle', { cx: 96, cy: TL - 6, r: 6, fill: C.ink2 }, line);
  s('text', { x: 110, y: TL, text: 'the role first written up (Locally Optimistic)', style: ink(15) }, line);
  s('line', { x1: 462, x2: 520, y1: TL - 6, y2: TL - 6, stroke: C.ink2, 'stroke-width': 2, 'stroke-dasharray': '2 6' }, line);
  s('circle', { cx: 532, cy: TL - 6, r: 6, fill: C.coral }, line);
  s('text', { x: 546, y: TL, text: 'almost eight years on: no shared definition', style: ink(17, C.coral, 700) }, line);

  // 3. the spectrum, with the duties that pull each way and the groups along it
  const spectrum = layer();
  s('line', { x1: LEFT, x2: RIGHT, y1: AXIS_Y, y2: AXIS_Y, stroke: C.line, 'stroke-width': 2 }, spectrum);
  s('text', { x: LEFT, y: 64, text: '◀ dashboards, analysis', style: ink(17, groups[0].col, 700) }, spectrum);
  s('text', { x: RIGHT, y: 64, 'text-anchor': 'end', text: 'modelling, data quality, pipelines ▶', style: ink(17, groups[groups.length - 1].col, 700) }, spectrum);
  const head = s('text', { x: W / 2, y: 30, 'text-anchor': 'middle', style: ink(18, C.ink, 700) }, svg);
  const headTag = s('g', { style: { opacity: 0, transition: 'opacity .5s' } }, svg);
  const setHead = (text, word, fill = C.ink) => {

  };

  const named = layer(), cardW = (RIGHT - LEFT) / groups.length, ROW = [AXIS_Y + 56, AXIS_Y + 78, AXIS_Y + 114, AXIS_Y + 148];
  groups.forEach((g, k) => {
    g.cx = LEFT + cardW * (k + .5); const mx = toX(g.m);
    s('path', { d: `M${mx} ${AXIS_Y - 2}l-7 -12h14z`, fill: g.col }, named);
    s('path', { d: `M${mx} ${AXIS_Y + 4}C${mx} ${AXIS_Y + 24} ${g.cx} ${AXIS_Y + 14} ${g.cx} ${AXIS_Y + 34}`, fill: 'none', stroke: g.col, 'stroke-width': 1.5 }, named);
    s('text', { x: g.cx, y: ROW[0], 'text-anchor': 'middle', text: g.name, style: ink(19, g.col, 700) }, named);
    s('text', { x: g.cx, y: ROW[1], 'text-anchor': 'middle', text: `${T.group_n[g.c]} ads`, style: ink(15) }, named);
  });

  // 4-6. what each end asks for
  const rows = {}, other = g => groups.length === 2 ? 'the other end' : 'the rest';
  rows.plain = layer(); rows.sql = layer(); rows.word = layer();
  groups.forEach(g => {
    s('text', { x: g.cx, y: ROW[2], 'text-anchor': 'middle', text: `${T.exact_ae[g.c]} titled “Analytics Engineer”`, style: ink(18, C.coral, 700) }, rows.plain);
    s('text', { x: g.cx, y: ROW[2], 'text-anchor': 'middle', text: `SQL ${Math.round(T.core[g.c])}%`, style: ink(18, C.ink, 700) }, rows.sql);
    const m = T.marks[g.c];
    s('text', { x: g.cx, y: ROW[3], 'text-anchor': 'middle', text: `${m.tool} ${Math.round(m.share)}%`, style: ink(20, C.coral, 700) }, rows.word);
    s('text', { x: g.cx, y: ROW[3] + 22, 'text-anchor': 'middle', text: `against ${Math.round(m.rest)}% at ${other(g)}`, style: ink(15) }, rows.word);

  const core = groups.map(g => Math.round(T.core[g.c])), coreText = Math.min(...core) === Math.max(...core) ? `${core[0]}%` : `${Math.min(...core)}–${Math.max(...core)}%`;

  // absolute state of every dot
  const paint = mode => dots.forEach(d => {
    const on = d.at && mode !== 'cloud', hot = mode === 'plain' && plain(d.i);
    d.el.style.transform = `translate(${on ? d.at[0] : d.x0}px,${on ? d.at[1] : d.y0}px)`;

  const intro = on => { fade(big, on); fade(sub, on); floaters.forEach((f, k) => later(() => fade(f, on), on && !Anim.fast ? 120 * k : 0)); };
  const spread = (mode, text, word, fill, ...on) => { intro(false); paint(mode); show(line, spectrum, named, ...on); setHead(text, word, fill); };

  return [
    async () => {   // hundreds of titles
      paint('cloud'); show(); setHead('', null); intro(true); big.textContent = '0';
      await countUp(big, T.n_titles, { dur: 1500 });
    },
    async () => {   // almost eight years on
      paint('cloud'); intro(true); big.textContent = T.n_titles; show(line); setHead('', null);
    },
    async () => {   // but every ad sits on one spectrum
      spread('spectrum', 'one spectrum, two ends', stable ? 'suggestive' : 'descriptive', C.ink);
    },
    optional(async () => {   // the plain title sits at both ends
      spread('plain', 'the plain title sits at both ends', null, C.coral, rows.plain);
    }),
    optional(async () => {   // the core travels
      spread('dim', `SQL at both ends: ${coreText} · ${T.n} ads`, null, C.ink, rows.sql);
    }),
    async () => {   // the word that tells the ends apart
      spread('dim', `search these words, not the title · ${T.n} ads`, null, C.coral, rows.sql, rows.word);
    }
  ];
}

/* The AI waffle: 1,211 dots, one per ad. Each build recolours the dots and swaps the panel on the right. */
function buildAI(stage) {
  const W = 1000, H = 520, A = D.ai, T = D.stats.ai, rows = A.rows, N = rows.length;
  const COLS = 42, cw = 13.4, x0 = 14, y0 = 62, R = 5.1, PX = 618, PW = 1000 - PX;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart' }, stage);
  const pos = k => [x0 + (k % COLS) * cw + cw / 2, y0 + Math.floor(k / COLS) * cw + cw / 2];
  const count = f => rows.filter(f).length;
  const isAI = q => q[0] === 1, isConc = q => q[1] === 2, isVague = q => q[1] === 1;
  const nAI = count(isAI), nC = count(isConc), nV = count(isVague), nReq = count(q => q[3]), nNoDuty = count(q => q[2]);
  const nUse = count(q => q[6]), nGuard = count(q => q[7]), nPrep = count(q => q[5]);
  const fmt = n => n.toLocaleString('en-US');

  /* two layouts: scrambled (step 1), then sorted concrete, vague, none */
  const slotA = Array(N), slotB = Array(N), kind = q => isConc(q) ? 0 : isVague(q) ? 1 : 2;
  shuffle([...Array(N).keys()], rng(5)).forEach((ad, k) => slotA[ad] = k);
  rows.map((q, i) => ({ i, g: kind(q) })).sort((a, b) => a.g - b.g || a.i - b.i).forEach((o, k) => slotB[o.i] = k);

  const G = s('g', {}, svg);
  const dots = rows.map((q, i) => { const [x, y] = pos(slotA[i]);
    const c = s('circle', { cx: 0, cy: 0, r: R }, G);
    Object.assign(c.style, { fill: C.grey, transform: `translate(${x}px,${y}px) scale(0)` }); return c; });
  /* one look per build: fill and opacity for each ad */
  const LOOK = {
    asks: q => [isAI(q) ? C.coral : C.grey, 1],
    kind: q => [[C.plum, C.coral, C.grey][kind(q)], 1],
    share: (base, hit) => q => hit(q) ? [C.coral, 1] : base(q) ? [C.plum, 1] : [C.grey, .5],
  };
  const paint = (slots, look, o = {}) => { const { move = 0, stagger = 0 } = o;
    rows.forEach((q, i) => { const [x, y] = pos(slots[i]), [fill, op] = look(q), c = dots[i], d = stagger ? Math.round((slots[i] / N) * stagger) : 0;
      c.style.transition = `transform ${move || .6}s cubic-bezier(.3,.8,.2,1) ${move ? (slots[i] % 70) * 9 : 0}ms, fill .45s ${d}ms, opacity .45s ${d}ms`;
      Object.assign(c.style, { transform: `translate(${x}px,${y}px) scale(1)`, fill, opacity: op }); }); };

  /* small SVG text helpers, used only here */
  const txt = (p, x, y, str, st = {}, attrs = {}) => s('text', { x, y, text: str, ...attrs, style: { fontSize: '16px', fill: C.ink, ...st } }, p);
  const wrap = (p, x, y, str, max, lh, st) => { const lines = [];
    str.split(' ').forEach(w => { const l = lines.length - 1; if (l >= 0 && (lines[l] + ' ' + w).length <= max) lines[l] += ' ' + w; else lines.push(w); });
    lines.forEach((l, k) => txt(p, x, y + k * lh, l, st)); return y + (lines.length - 1) * lh; };
  const layer = () => s('g', { style: { opacity: 0, transition: 'opacity .5s' } }, svg);
  const kicker = (p, y, word) => txt(p, PX, y, word, { font: "700 15px 'JetBrains Mono',monospace", letterSpacing: '.08em', textTransform: 'uppercase', fill: C.ink2 });
  const dot = (p, x, y, fill) => s('circle', { cx: x, cy: y - 5, r: 6, fill }, p);

  /* the key above the waffle, one per look */
  const key = items => { const g = layer(); let x = x0;
    items.forEach(([fill, str]) => { dot(g, x + 6, 32, fill); const t = txt(g, x + 18, 32, str, { fontSize: '16px', fill: C.ink2 }); x += 18 + str.length * 8.1 + 22; }); return g; };
  const keys = {
    asks: key([[C.coral, `ask for AI in the role`], [C.grey, 'no AI ask']]),
    kind: key([[C.plum, `names a tool or a task ${nC}`], [C.coral, `stays vague ${nV}`], [C.grey, 'no AI ask']]),
    req: key([[C.plum, `require AI ${nReq}`], [C.coral, `…and list no AI duty ${nNoDuty}`]]),
    use: key([[C.plum, `ask to use AI tools ${nUse}`], [C.coral, `…and mention checking the output ${nGuard}`]]),
    prep: key([[C.plum, `ask for AI ${nAI}`], [C.coral, `…to get the data ready for AI ${nPrep}`]]),
  };

  /* right-hand panels, one per build */
  const P = {};
  P.find = layer();
  const big = txt(P.find, PX, 200, '0%', { fontSize: '120px', fontWeight: 700, fill: C.coral, letterSpacing: '-.05em' });
  txt(P.find, PX, 248, 'ask for AI in the role', { fontSize: '28px', fontWeight: 700 });
  txt(P.find, PX, 282, `${fmt(nAI)} of ${fmt(N)} ads`, { fontSize: '18px', fill: C.ink2 });

  P.kind = layer();
  kicker(P.kind, 40, 'practical');
  const card = (y, h, col, label, quote, who) => {

  card(58, 136, C.coral, `VAGUE · ${pct(nV, nAI)}%`, D.quotes.vague, 'Aritzia');

}

/* Benefits grid: share of ads in each region that mention each benefit, read as a negotiation map. Pay row and Indeed ticks close it. */
function buildBenefits(stage, v2 = false) {
  const W = 1000, H = 540, B = D.benefits, SUM = D.stats2.benefits_summary, regs = B.regions, tags = B.tags.filter(t => t !== 'remote_flex');
  const label = { health: 'health insurance', pension: 'pension / 401k', equity: 'equity', bonus: 'bonus', pto: 'paid time off', parental: 'parental leave',
    learning: 'learning budget', wellbeing: 'wellbeing', meal: 'meal vouchers', transport: 'transport', flex_hours: 'flexible hours' };
  const short = r => r.replace('UK & Ireland', 'UK & IE').replace('Southern Europe', 'S. Europe').replace('CEE/Baltics', 'CEE');
  const L = 178, T = 34, cw = 88, rh = 33, PY = T + tags.length * rh + 14, PH = 62, CAP = PY + 34, CAP2 = PY + PH + 36;
  const stops = [[0, '#fbeee9'], [15, '#f5d0c8'], [35, '#ea5b4d'], [60, '#5b2a4a']];
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart' }, stage), key = (t, r) => t + '|' + r;
  regs.forEach((r, ci) => s('text', { x: L + ci * cw + cw / 2, y: 24, 'text-anchor': 'middle', text: short(r), style: { fontSize: '16px', fontWeight: 700, fill: C.ink } }, svg));
  const rowLab = tags.map((t, ri) => s('text', { x: L - 12, y: T + ri * rh + 22, 'text-anchor': 'end', text: label[t] || t,
    style: { fontSize: '16px', fontWeight: 500, fill: C.ink2, transition: 'fill .4s' } }, svg));
  const cells = [], byKey = {};
  tags.forEach((t, ri) => regs.forEach((r, ci) => {
    const v = B.pct[t][r] ?? 0, x = L + ci * cw, y = T + ri * rh, base = scale(stops, v);
    const g = s('g', { style: { opacity: 0 } }, svg);
    const rect = s('rect', { x: x + 2, y: y + 2, width: cw - 4, height: rh - 4, rx: 6, style: { fill: base, transition: 'fill .5s' } }, g);
    const num = s('text', { x: x + cw / 2, y: y + 22, 'text-anchor': 'middle', text: Math.round(v), style: { fontSize: '16px', fontWeight: 700, fill: v > 28 ? '#fff' : C.ink2, transition: 'fill .5s' } }, g);
    rect.addEventListener('mousemove', e => tip.show(e, `<b>${label[t]}</b><br>${r}: ${v}% of ${B.n[r]} ads`)); rect.addEventListener('mouseleave', () => tip.hide());
    const c = { g, rect, num, t, r, ri, ci, v, x, y, base, ink: v > 28 ? '#fff' : C.ink2 }; cells.push(c); byKey[key(t, r)] = c;
  }));
  /* lever = each region's benefit that its ads list at least 10 points more often than the other regions' average; regions with none get no ring */
  const lever = regs.map(r => tags.map(t => { const o = regs.filter(x => x !== r).map(x => B.pct[t][x] ?? 0); return { t, r, d: (B.pct[t][r] ?? 0) - o.reduce((a, b) => a + b, 0) / o.length }; })
    .sort((a, b) => b.d - a.d)[0]).filter(x => x.d >= 10).map(x => key(x.t, x.r));
  const SETS = { extreme: [['health', 'US'], ['pension', 'US'], ['equity', 'US'], ['meal', 'France'], ['pension', 'France']].map(([t, r]) => key(t, r)),
    law: [['pension', 'France'], ['health', 'DACH'], ['pto', 'France']].map(([t, r]) => key(t, r)), lever };
  const rings = {};
  for (const set in SETS) rings[set] = SETS[set].map(k => { const c = byKey[k];
    return s('rect', { x: c.x, y: c.y, width: cw, height: rh, rx: 8, fill: 'none', stroke: C.ink, 'stroke-width': 3, 'stroke-dasharray': set === 'law' ? '6 4' : 'none',
      style: { opacity: 0, transition: 'opacity .4s' } }, svg); });
  /* pay row: share of ads stating pay, Indeed tick where a country maps to the region */
  const pay = s('g', { style: { opacity: 0, transition: 'opacity .5s' } }, svg), bars = [], IND = B.indeed_pay, indBy = {};
  for (const c in IND.grid_region) indBy[IND.grid_region[c]] = IND.pct[c];
  s('text', { x: L - 12, y: PY + 23, 'text-anchor': 'end', text: 'pay stated', style: { fontSize: '16px', fontWeight: 700, fill: C.ink } }, pay);
  s('text', { x: L - 22, y: PY + 48, 'text-anchor': 'end', text: 'Indeed, all ads', style: { fontSize: '15px', fill: C.ink2 } }, pay);
  s('line', { x1: L - 13, x2: L - 13, y1: PY + 34, y2: PY + 52, stroke: C.ink, 'stroke-width': 2.5 }, pay);
  const bx = 8, bw = cw - 16;
  regs.forEach((r, ci) => { const p = B.pay[r], x = L + ci * cw;
    const bg = s('rect', { x: x + 2, y: PY + 2, width: cw - 4, height: PH - 4, rx: 6, fill: C.paper, stroke: C.line }, pay);
    s('text', { x: x + cw / 2, y: PY + 21, 'text-anchor': 'middle', text: Math.round(p.pct), style: { fontSize: '16px', fontWeight: 700, fill: C.ink } }, pay);
    s('rect', { x: x + bx, y: PY + 28, width: bw, height: 9, rx: 3, fill: C.grey }, pay);
    bars.push({ el: s('rect', { x: x + bx, y: PY + 28, width: 0, height: 9, rx: 3, fill: C.coral }, pay), to: bw * p.pct / 100 });
    const ind = indBy[r];
    if (ind != null) { const tx = x + bx + bw * ind / 100;
      s('line', { x1: tx, x2: tx, y1: PY + 23, y2: PY + 42, stroke: C.ink, 'stroke-width': 2.5 }, pay);
      s('text', { x: Math.max(x + 16, Math.min(x + cw - 16, tx)), y: PY + 56, 'text-anchor': 'middle', text: ind, style: { fontSize: '15px', fontWeight: 700, fill: C.ink2 } }, pay); }
    bg.addEventListener('mousemove', e => tip.show(e, `<b>pay stated</b><br>${r}: ${p.k} of ${p.n} ads${ind != null ? `<br>Indeed, all ads (${Object.keys(IND.grid_region).find(c => IND.grid_region[c] === r)}): ${ind}%` : ''}`));
    bg.addEventListener('mouseleave', () => tip.hide()); });
  /* one caption per build; a verdict pill, when there is one, sits before the claim */
  const caption = (y, words, verdict) => { const g = s('g', { style: { opacity: 0, transition: 'opacity .4s' } }, svg); let x = L + 2;
    if (verdict) { tag(g, x, y - 4, verdict, { size: 15 }); x += verdict.length * 15 * .62 + 15 * 1.4 + 12; }
    const tx = s('text', { x, y, style: { fontSize: '21px', fontWeight: 500, fill: C.ink } }, g);
    words.forEach(([w, hi]) => s('tspan', { text: w, style: hi ? { fill: C.coral, fontWeight: 700 } : {} }, tx)); return g; };
  const caps = {
    norm: caption(CAP, [['the norm: what ads in each region list']]),
    differ: caption(CAP, [['the norm differs: '], [`${SUM.differ_q01} of ${SUM.tags} benefits`, 1], [' vary by region']], 'conclusive'),
    law: caption(CAP, [['a pale cell ≠ not offered: '], ['the law may already give it', 1]], 'untested'),
    lever: caption(CAP, [['your lever: what your region’s ads list '], ['more than elsewhere', 1]]),
    ask: caption(CAP, [['not in the ad? '], ['ask for what the competition lists', 1]]),
    v2: caption(CAP, [['the norm differs by region: '], ['the competition is your lever', 1]], 'conclusive'),
    pay: caption(CAP2, [['the EU directive wants pay shown: '], ['will this row fill in?', 1]], 'descriptive')
  };
  /* every step sets the whole picture: lit cells, ring set, ask fills, caption, pay row */
  const show = o => {
    const lit = o.ring ? new Set(SETS[o.ring]) : null, ask = o.ask ? new Set(SETS.lever) : new Set();
    cells.forEach(c => { const on = !lit || lit.has(key(c.t, c.r));
      c.g.style.transition = `opacity .5s ${o.stagger && !Anim.fast ? c.ci * 140 + c.ri * 15 : 0}ms`;
      c.g.style.opacity = o.fade ? .5 : on ? 1 : .22;
      c.rect.style.fill = ask.has(key(c.t, c.r)) ? C.coral : c.base; c.num.style.fill = ask.has(key(c.t, c.r)) ? '#fff' : c.ink; });
    for (const set in rings) rings[set].forEach(el => { el.style.opacity = set === o.ring ? 1 : 0; });
    tags.forEach((t, ri) => { const hit = lit && regs.some(r => lit.has(key(t, r))), asked = regs.some(r => ask.has(key(t, r)));
      rowLab[ri].style.fill = asked ? C.coral : hit ? C.ink : C.ink2; rowLab[ri].style.fontWeight = asked || hit ? 700 : 500; });
    for (const k in caps) caps[k].style.opacity = k === o.cap ? 1 : 0;
    pay.style.opacity = o.pay ? 1 : 0;
    if (!o.pay) bars.forEach(b => b.el.setAttribute('width', 0));
    return o.pay ? tween(1100, e => bars.forEach(b => b.el.setAttribute('width', b.to * e)), { delay: 300 }) : wait(Anim.fast ? 0 : 700);
  };
  if (v2) return [async () => { show({ stagger: true }); if (!(await wait(Anim.fast ? 0 : regs.length * 140 + 700))) return; await show({ cap: 'v2', ring: 'extreme' }); }];
  return [
    async () => { show({ cap: 'norm', stagger: true }); await wait(Anim.fast ? 0 : regs.length * 140 + 700); },
    async () => { await show({ cap: 'differ', ring: 'extreme' }); },
    optional(async () => { await show({ cap: 'law', ring: 'law' }); }),
    optional(async () => { await show({ cap: 'lever', ring: 'lever' }); }),
    async () => { await show({ cap: 'ask', ring: 'lever', ask: true }); },
    async () => { await show({ cap: 'pay', fade: true, pay: true }); }
  ];
}

/* Pitch: 937 ads on the duty-by-stack map. In the deck, builds go from "no shared tool mix" to three calls to action; the explorer keeps the interactive tool picker. */
const PITCH_REGION_NAMES = { apac: 'Asia-Pacific', baltics: 'Baltics', benelux: 'Benelux', berlin: 'Berlin', dach_other: 'Rest of Germany, Austria, Switzerland',
  france: 'France', global_remote: 'Remote, any country', hamburg: 'Hamburg', iberia: 'Spain and Portugal', ireland: 'Ireland', nordics: 'Nordics',
  nyc_metro: 'New York area', other: 'Rest of world', other_europe: 'Rest of Europe', uk_remote: 'United Kingdom' };
const popcount = v => { let c = 0; while (v) { c += v & 1; v >>= 1; } return c; };

function pitchMap(svg, ads, box) {
  const { x: L, y: T, w: W, h: H } = box;
  const xs = ads.map(a => a[0]).sort((a, b) => a - b), ys = ads.map(a => a[1]).sort((a, b) => a - b);
  const q = (arr, p) => arr[Math.floor(p * (arr.length - 1))], x0 = q(xs, .01), x1 = q(xs, .99), y0 = q(ys, .01), y1 = q(ys, .99);
  const X = v => L + (Math.min(x1, Math.max(x0, v)) - x0) / (x1 - x0) * W, Y = v => T + H - (Math.min(y1, Math.max(y0, v)) - y0) / (y1 - y0) * H;
  const axis = { fill: C.ink2, fontSize: '15px' };
  s('text', { x: L, y: T + H + 30, text: '← BI and reporting', style: axis }, svg);
  s('text', { x: L + W, y: T + H + 30, 'text-anchor': 'end', text: 'modelling, pipelines, warehouse →', style: axis }, svg);
  s('text', { x: L - 16, y: T + H, transform: `rotate(-90 ${L - 16} ${T + H})`, text: 'Power BI · Azure · Fabric', style: axis }, svg);
  s('text', { x: L - 16, y: T, 'text-anchor': 'end', transform: `rotate(-90 ${L - 16} ${T})`, text: 'dbt · Snowflake · BigQuery →', style: axis }, svg);
  const rr = rng(4), g = s('g', {}, svg);
  return ads.map(a => { const c = s('circle', { cx: X(a[0]) + (rr() - .5) * 4, cy: Y(a[1]) + (rr() - .5) * 4, r: 0, fill: C.grey }, g);
    c.addEventListener('mousemove', e => tip.show(e, `<b>${a[5]}</b>`)); c.addEventListener('mouseleave', () => tip.hide()); return c; });
}

function buildPitch(stage, v2 = false) {
  return stage.classList.contains('vstage') ? buildPitchExplorer(stage) : buildPitchDeck(stage, v2);
}

function buildPitchDeck(stage, v2 = false) {
  const P = D.pitch, ads = P.ads, Tp = P.template, Wv = 1000, Hv = 520;
  const svg = s('svg', { viewBox: `0 0 ${Wv} ${Hv}`, class: 'chart' }, stage);
  const dots = pitchMap(svg, ads, { x: 44, y: 34, w: 540, h: 430 });
  dots.forEach(c => { c.style.transition = 'fill .5s, r .5s, opacity .5s'; });
  // per-ad roles, recomputed from the masks so the dots match the counts in D.pitch
  const mix = {}; ads.forEach(a => mix[a[2]] = (mix[a[2]] || 0) + 1);
  const masks = Object.keys(mix).map(Number);
  const T = D.tools.reduce((m, t, k) => Tp.tools.includes(t) ? m | 1 << k : m, 0);
  const role = ads.map(a => ({ unique: mix[a[2]] === 1, apart: mix[a[2]] === 1 && masks.some(o => popcount(o ^ a[2]) === 1),
    exact: a[2] === T, away: popcount(a[2] & ~T) === 1, upper: a[3] >= 2, core: (a[2] & T) !== 0 }));
  const paint = f => dots.forEach((c, i) => { const [fill, r, o] = f(role[i]); c.style.fill = fill; c.style.r = r; c.style.opacity = o; });
  const base = [C.grey, 3, .9], lit = [C.coral, 3.6, 1];

  // map caption: what coral means at this build
  const cap = s('text', { x: 44, y: 22, style: { fill: C.ink2, fontSize: '15px', transition: 'opacity .4s' } }, svg);
  const setCap = t => { cap.textContent = t; cap.style.opacity = t ? 1 : 0; };
  const ring = s('g', { style: { opacity: 0, transition: 'opacity .5s' } }, svg);
  ads.forEach((a, i) => { if (role[i].exact) s('circle', { cx: dots[i].getAttribute('cx'), cy: dots[i].getAttribute('cy'), r: 11, fill: 'none', stroke: C.ink, 'stroke-width': 2 }, ring); });

  // right panel: evidence page, then the three lanes
  const px = 640, grp = () => s('g', { style: { opacity: 0, transition: 'opacity .5s' } }, svg);
  const txt = (g, x, y, t, st = {}) => s('text', { x, y, text: t, style: { fill: C.ink, fontSize: '17px', ...st } }, g);
  const gN = grp(); txt(gN, px, 62, P.n.toLocaleString('en-US'), { fontSize: '44px', fontWeight: 700, letterSpacing: '-.03em' });
  txt(gN, px + 104, 44, 'ads that name a tool'); txt(gN, px + 104, 64, 'one dot each', { fill: C.ink2, fontSize: '15px' });
  const gU = grp(); txt(gU, px, 132, pct(P.unique, P.n) + '%', { fontSize: '44px', fontWeight: 700, fill: C.coral, letterSpacing: '-.03em' });
  txt(gU, px + 104, 114, 'have a tool mix'); txt(gU, px + 104, 134, 'no other ad names'); tag(gU, px + 104, 162, 'descriptive');
  const gA = grp(); txt(gA, px, 200, `${P.one_apart} of them: one tool from another ad`, { fontWeight: 700 });
  txt(gA, px, 221, 'same core, specific tail', { fill: C.ink2, fontSize: '15px' });
  const gT = grp(); txt(gT, px, 256, 'a template CV: the five most-named tools', { fill: C.ink2, fontSize: '15px' });
  let cx = px; Tp.tools.forEach(t => { const w = t.length * 8.6 + 20;
    s('rect', { x: cx, y: 266, width: w, height: 28, rx: 14, fill: C.paper, stroke: C.plum, 'stroke-width': 1.5 }, gT);
    txt(gT, cx + w / 2, 285, t, { fontSize: '15px', textAnchor: 'middle', fill: C.plum, fontWeight: 500 }); cx += w + 6; });
  txt(gT, px, 324, `fits ${Tp.exact} ads exactly`, { fontWeight: 700, fontSize: '19px' });
  const gO = grp(); txt(gO, px, 366, `${Tp.one_away} are one tool away`, { fontWeight: 700, fontSize: '19px', fill: C.coral });
  const mx = Math.max(...Tp.one_away_missing.map(m => m[1]));
  Tp.one_away_missing.forEach(([t, n], k) => { const y = 388 + k * 26;
    txt(gO, px, y + 14, t, { fontSize: '15px', fill: C.ink2 });
    s('rect', { x: px + 80, y: y + 2, width: n / mx * 170, height: 16, rx: 3, fill: C.coral, opacity: .8 }, gO);
    txt(gO, px + 86 + n / mx * 170, y + 15, '+' + n, { fontSize: '15px', fontWeight: 700 }); });
  txt(gO, px, 492, 'that one tool is your pitch', { fontWeight: 700, fontSize: '21px', fill: C.coral });
  const evidence = [gN, gU, gA, gT, gO];

  const lanes = [
    { who: 'hiring?', head: 'What is missing from your ad?', body: ['honest years · one concrete AI sentence', 'pay · the stack you run'] },
    { who: 'moving up?', head: 'Practise the next verb.', body: ['same tools, bigger verb:', 'support → own → lead'] },
    { who: 'starting out?', head: 'The core is the same everywhere.', body: ['your background is the niche:', 'pitch the mix only you have'] }
  ].map((l, k) => { const g = grp(), y = 40 + k * 152;
    const bar = s('rect', { x: px - 14, y: y - 4, width: 5, height: 118, rx: 2.5, fill: C.coral }, g);
    txt(g, px, y + 14, l.who.toUpperCase(), { fontSize: '15px', fill: C.coral, fontWeight: 700, letterSpacing: '.08em', fontFamily: "'JetBrains Mono',monospace" });
    txt(g, px, y + 46, l.head, { fontSize: '22px', fontWeight: 700 });
    l.body.forEach((b, j) => txt(g, px, y + 78 + j * 24, b, { fontSize: '17px', fill: C.ink2 }));
    return { g, bar }; });

  // absolute state of the panel: which evidence lines show, which lane is lit (lane 3 = all three lit)
  const panel = (upTo, lane) => {
    evidence.forEach((g, k) => g.style.opacity = lane < 0 && k <= upTo ? 1 : 0);
    lanes.forEach((l, k) => { const lit = k === lane || lane === 3; l.g.style.opacity = k > lane ? 0 : lit ? 1 : .55; l.bar.style.opacity = lit ? 1 : 0; });
  };
  const show = (upTo, lane, f, caption, ringOn = false) => { panel(upTo, lane); paint(f); setCap(caption); ring.style.opacity = ringOn ? 1 : 0; };

  const steps = [
    async () => { panel(0, -1); setCap(''); ring.style.opacity = 0;
      dots.forEach((c, i) => { c.style.opacity = 0; c.style.r = 0; c.style.fill = C.mute; later(() => { c.style.r = 3; c.style.opacity = .9; }, (i % 200) * 5); });
      await wait(1300); },
    async () => show(1, -1, r => r.unique ? lit : base, 'coral: a tool mix found in one ad only'),
    optional(async () => show(2, -1, r => r.apart ? lit : r.unique ? ['#f3a79e', 3, .9] : base, 'coral: one tool away from another ad\'s mix')),
    optional(async () => show(3, -1, r => r.exact ? [C.coral, 6, 1] : [C.grey, 2.6, .7], 'ringed: ads that name exactly the template', true)),
    async () => show(4, -1, r => r.exact ? [C.plum, 6, 1] : r.away ? lit : [C.grey, 2.6, .7], 'coral: one tool short of the template · ringed: exact fit', true),
    optional(async () => show(4, 0, r => r.unique ? lit : base, 'coral: a tool mix found in one ad only')),
    optional(async () => show(4, 1, r => r.upper ? lit : base, 'coral: senior and lead ads')),
    async () => show(4, 2, r => r.core ? lit : base, 'coral: ads that name a template tool')
  ];
  if (v2) return [chain(steps[0], steps[1]), async () => show(4, 3, r => r.unique ? lit : base, `coral: ${pct(P.unique, P.n)}% of ads, a tool mix no other ad names`)];
  return steps;
}

/* Explorer only: pick your tools, a level and a region; ads that name only tools you have light up. */
function buildPitchExplorer(stage) {
  const P = D.pitch, ads = P.ads, T = D.tools;
  const wrap = h('div', { class: 'pitch' }); stage.append(wrap);
  const left = h('div', { class: 'pmap' }), right = h('div', { class: 'ppanel' }); wrap.append(left, right);
  const svg = s('svg', { viewBox: '0 0 640 540', class: 'chart' }, left);
  const dots = pitchMap(svg, ads, { x: 40, y: 30, w: 580, h: 440 });
  const mine = new Set();
  const lvl = h('select', { class: 'sel' }, ['any level', 'junior', 'mid', 'senior', 'lead+'].map((l, i) => h('option', { value: i - 1 }, l)));
  const regs = P.regions.slice().sort((a, b) => (PITCH_REGION_NAMES[a] || a).localeCompare(PITCH_REGION_NAMES[b] || b));
  const reg = h('select', { class: 'sel' }, [h('option', { value: '' }, 'any region'), ...regs.map(r => h('option', { value: r }, PITCH_REGION_NAMES[r] || r))]);
  const chips = h('div', { class: 'chips' }), out = h('div', { class: 'pout' });
  const chipEls = T.map((t, k) => { const c = h('button', { class: 'tchip', 'aria-pressed': 'false' }, t); c.onclick = () => toggle(k); chips.append(c); return c; });
  right.append(h('div', { class: 'plab' }, 'Your tools'), chips, h('div', { class: 'psel' }, lvl, reg), out);
  function toggle(k, on) { const want = on ?? !mine.has(k); if (want) mine.add(k); else mine.delete(k); chipEls[k].setAttribute('aria-pressed', String(want)); update(); }
  function update() {
    const L = +lvl.value, R = reg.value; let mask = 0; mine.forEach(k => mask |= 1 << k);
    const sel = ads.map(a => (L < 0 || a[3] === L) && (!R || a[4] === R));
    const pool = sel.filter(Boolean).length; let match = 0, near = 0, exact = 0; const miss = {};
    ads.forEach((a, i) => { const el = dots[i]; if (!sel[i]) { el.style.fill = C.line; el.style.opacity = .35; el.setAttribute('r', 2.2); return; }
      const m = a[2] & ~mask, nm = popcount(m);
      if (a[2] === mask && mask) exact++;
      if (mask && nm === 0) { match++; el.style.fill = C.coral; el.style.opacity = 1; el.setAttribute('r', 5); }
      else if (mask && nm === 1) { near++; const k = Math.log2(m); miss[k] = (miss[k] || 0) + 1; el.style.fill = C.amber; el.style.opacity = .9; el.setAttribute('r', 3.8); }
      else { el.style.fill = C.grey; el.style.opacity = .75; el.setAttribute('r', 2.8); } });
    const gaps = Object.entries(miss).sort((a, b) => b[1] - a[1]).slice(0, 3);
    if (!mask) { out.innerHTML = `<div class="phint">${pool} ads. Pick your tools: ads naming only those turn coral.</div>`; return; }
    out.innerHTML = `<div class="bigstat"><span>${pct(match, pool)}%</span></div><div class="lbl2">${match} of ${pool} ads name only tools you have</div>
      <div class="pgap"><b>One tool away</b> (${near} ads): ${gaps.length ? gaps.map(([k, n]) => `${T[k]} +${n}`).join(' · ') : 'none'}</div>
      <div class="pgap">${exact ? `Exactly your mix: <b>${exact}</b> ad${exact > 1 ? 's' : ''}.` : 'No ad names exactly your mix.'}</div>`;
  }
  lvl.onchange = reg.onchange = update;
  const demo = Tp => Tp.map(t => T.indexOf(t)).filter(k => k >= 0);
  return [
    async () => { mine.clear(); chipEls.forEach(c => c.setAttribute('aria-pressed', 'false')); lvl.value = -1; reg.value = ''; update();
      dots.forEach((c, i) => { c.style.transition = 'fill .4s, opacity .4s, r .4s'; later(() => c.setAttribute('r', 2.8), (i % 200) * 5); }); await wait(1300); },
    async () => { mine.clear(); chipEls.forEach(c => c.setAttribute('aria-pressed', 'false'));
      for (const k of demo(P.template.tools)) { toggle(k, true); if (!(await wait(700))) return; } }
  ];
}

/* Duty gaps: Power BI / Fabric ads minus dbt + warehouse ads, share of duties by theme. Dots slide out to their value. */
function buildGap(stage) {
  const G = D.gap, W = 1000, H = 540, svg = s('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart' }, stage);
  const idx = G.themes.map((_, i) => i).sort((a, b) => G.mean[b] - G.mean[a]), L = 290, lo = -.06, hi = .14, X = v => L + (v - lo) / (hi - lo) * (W - L - 40);
  const short = t => ({ 'Business Analysis & Insight Generation': 'Business analysis & insight', 'Stakeholder Collaboration & Requirements': 'Stakeholder collaboration',
    'Self-Service Enablement & Data Literacy': 'Self-service & literacy', 'Pipeline Engineering & Orchestration': 'Pipelines & orchestration', 'Data Infrastructure & Warehouse Ops': 'Warehouse & infra ops',
    'Architecture & Platform Strategy': 'Architecture & platform', 'Performance & Cost Optimization': 'Performance & cost', 'Data Modeling & Transformation': 'Data modelling', 'Governance & Documentation': 'Governance & docs',
    'Security, Privacy & Risk': 'Security & risk', 'Vendor & Tooling Evaluation': 'Vendor evaluation', 'Data Quality & Testing': 'Data quality & testing', 'Mentorship & Leadership': 'Mentorship & leadership',
    'Data Ownership (end-to-end)': 'End-to-end ownership', 'AI & Agentic Workflows': 'AI & agentic workflows', 'BI & Reporting/Dashboards': 'BI & reporting' }[t] || t);
  [-.04, 0, .04, .08, .12].forEach(v => { s('line', { x1: X(v), x2: X(v), y1: 56, y2: 505, stroke: v ? C.line : C.mute }, svg); s('text', { x: X(v), y: 526, 'text-anchor': 'middle', class: 'tick', text: (v > 0 ? '+' : '') + Math.round(v * 100) + ' points' }, svg); });
  s('text', { x: X(0) - 10, y: 36, 'text-anchor': 'end', class: 'lbl', text: '← more in dbt + warehouse ads' }, svg); s('text', { x: X(0) + 10, y: 36, class: 'lbl', text: 'more in Power BI / Fabric ads →' }, svg);
  const rows = idx.map((i, k) => { const y = 74 + k * 27, sig = G.holm[i] < .05, big = G.themes[i].startsWith('BI &');
    s('text', { x: L - 14, y: y + 5, 'text-anchor': 'end', class: sig ? 'rowlab2 sig' : 'rowlab2', text: short(G.themes[i]), style: { fill: sig ? C.ink : C.ink2, fontWeight: sig ? 700 : 500 } }, svg);
    const bar = s('line', { x1: X(0), x2: X(0), y1: y, y2: y, stroke: sig ? C.coral : C.mute, 'stroke-width': big ? 5 : 3, 'stroke-linecap': 'round' }, svg);
    const dot = s('circle', { cx: X(0), cy: y, r: big ? 9 : 6, fill: sig ? C.coral : C.bg, stroke: sig ? C.bg : C.mute, 'stroke-width': 2 }, svg);
    const hit = s('rect', { x: 0, y: y - 12, width: W, height: 24, fill: 'transparent' }, svg);
    hit.addEventListener('mousemove', e => tip.show(e, `<b>${G.themes[i]}</b><br>gap ${(G.mean[i] * 100).toFixed(1)} points, likely between ${(G.lo[i] * 100).toFixed(1)} and ${(G.hi[i] * 100).toFixed(1)}<br>${G.holm[i] < 0.05 ? 'a real difference' : 'could be chance'}`)); hit.addEventListener('mouseleave', () => tip.hide());
    return { i, bar, dot, k }; });
  return [async () => { await Promise.all(rows.map(({ i, bar, dot, k }) => tween(1100, e => { const m = X(G.mean[i] * e), a = X(G.lo[i] * e), b = X(G.hi[i] * e);
    dot.setAttribute('cx', m); bar.setAttribute('x1', a); bar.setAttribute('x2', b); }, { delay: k * 70, ease: E.out }))); }];
}

/* What the ad leaves out: the share of ads that tell you each thing you would ask on a first call, then the ones to ask about. */
function buildMissing(stage) {
  const W = 1000, M = D.missing, items = [...M.items].sort((a, b) => b.pct - a.pct), ask = items.filter(it => it.pct < 50);

  txt(svg, L, 30, `share of ${M.n.toLocaleString('en-US')} ads that tell you…`, { fontSize: '18px', fill: C.ink2, fontWeight: 500 });
  tag(svg, W - 8, 30, 'descriptive', { anchor: 'end' });
  const rows = items.map((it, i) => { const y = T + i * RH, g = s('g', { style: { transition: 'opacity .5s' } }, svg);
    txt(g, L - 20, y + 30, it.label, { fontSize: '22px', fontWeight: 700 }, { 'text-anchor': 'end' });
    s('rect', { x: L, y: y + 8, width: BW, height: 32, rx: 8, fill: C.grey, opacity: .45 }, g);
    const bar = s('rect', { x: L, y: y + 8, width: 0, height: 32, rx: 8, fill: C.coral }, g);
    const num = txt(g, L + BW + 16, y + 33, '0%', { fontSize: '26px', fontWeight: 700 });
    return { it, g, bar, num }; });
  const gAsk = s('g', { style: { opacity: 0, transition: 'opacity .5s' } }, svg), y0 = T + (items.length - ask.length) * RH, y1 = T + items.length * RH - 14;
  s('rect', { x: 20, y: y0 - 4, width: W - 40, height: y1 - y0 + 10, rx: 14, fill: 'none', stroke: C.coral, 'stroke-width': 3 }, gAsk);

  const fill = e => rows.forEach(r => { r.bar.setAttribute('width', BW * r.it.pct / 100 * e); r.num.textContent = Math.round(r.it.pct * e) + '%'; });
  return [
    async () => { gAsk.style.opacity = 0; rows.forEach(r => r.g.style.opacity = 1); fill(0); await tween(1200, fill, { ease: E.inOut }); },
    async () => { fill(1); rows.forEach(r => r.g.style.opacity = ask.includes(r.it) ? 1 : .35); gAsk.style.opacity = 1; await wait(Anim.fast ? 0 : 500); }
  ];
}

      foot: 'Junior = ads whose text reads as junior (an AI model labelled every ad): 64 of 1,211, about 1 in 20. Two years or more = the smallest number of years of experience the ad asks for: 12 of 64. Half of junior ads state no years.' },
    { ...by.ladder, kick: q(4, by.ladder), build: st => { const f = buildLadder(st); return [f[0], chain(f[1], f[2]), f[3]]; },
      foot: 'Share of English ads at each level that mention it: 992 ads (43 junior, 441 mid, 410 senior, 98 lead or above). The verb rises at every step; the core does not move. These are ads for outside hires, not a promotion guide.' },
    { id: 'missing', name: 'Left out', kick: 'Question 5 · What doesn’t the ad tell me?', title: 'The ad asks. <em>It rarely answers.</em>', build: buildMissing,
      foot: `All ${D.missing.n.toLocaleString('en-US')} ads. Pay, remote or office, and interview steps come from fields read from each ad; years, reporting line and team size are found in the ad text. A hand read of 60 ads agreed on 55 to 60 of them for each item. The numbers describe these ads; there is no test.` },
    { ...by.pitch, kick: q(6, by.pitch), build: st => buildPitch(st, true),
      foot: '937 ads that name at least one of 19 tools. A mix is the set of tools an ad names, mentioned rather than required. The numbers describe these ads; there is no test.' },
    { ...by.close, build: st => { const f = buildAdSlide(st, true); return [instant(f[0], f[1], f[2]), f[3]]; } });
}

/* Deck runtime: sections, steps (Space/Right/Enter build, Left unbuild), pills, progress, replay on entry. */
const DECK = { cur: 0, step: 0, steps: [], busy: false };
function mountSlide(i) {
  const sec = $$('section.slide')[i], stage = $('.stage', sec);
  Anim.cancel(); Anim.fast = false; stage.innerHTML = ''; tip.hide();
  DECK.steps = SLIDES[i].build(stage).filter(f => !(DECK.short && f.optional)); DECK.step = 0; DECK.cur = i; updateDots();
}
async function playTo(i, k) {            // rebuild slide i and run steps up to (and including) k-1 instantly, then animate step k-1 if animate
  mountSlide(i); Anim.fast = true;
  for (let j = 0; j < k - 1; j++) { await DECK.steps[j](); }
  Anim.fast = false; DECK.step = k - 1; await advance(true);
}
async function advance(first) {
  if (DECK.step >= DECK.steps.length) return false;
  const k = DECK.step; DECK.step++; updateDots();
  await DECK.steps[k]();
  return true;
}
function updateDots() { const d = $('#stepdots'); if (!d) return; d.innerHTML = ''; for (let k = 0; k < DECK.steps.length; k++) d.append(h('i', { class: (k < DECK.step ? 'on ' : '') + (DECK.steps[k].optional ? 'opt' : '') })); }
function goSlide(i, behavior = 'smooth', mode = 'first') { i = Math.max(0, Math.min(SLIDES.length - 1, i)); DECK.mode = mode; $$('section.slide')[i].scrollIntoView({ behavior }); }
async function next() {
  if (DECK.step < DECK.steps.length) { await advance(); return; }
  if (DECK.cur < SLIDES.length - 1) goSlide(DECK.cur + 1);
}
async function prev() {
  if (DECK.step > 1) { Anim.cancel(); await playTo(DECK.cur, DECK.step - 1); return; }
  if (DECK.cur > 0) goSlide(DECK.cur - 1, 'smooth', 'final');   // previous slide, as you left it; keep pressing back to unbuild it
}
async function showFinal(i) {              // mount slide i with every step already shown
  mountSlide(i); Anim.fast = true;
  for (let j = 0; j < DECK.steps.length; j++) { DECK.step = j + 1; await DECK.steps[j](); }
  Anim.fast = false; updateDots();
}
function initDeck() {
  const main = $('#deck');
  SLIDES.forEach((S, i) => main.append(h('section', { class: 'slide', id: 's-' + S.id },
    h('div', { class: 'kick' }, S.kick), h('h1', { html: S.title }), h('div', { class: 'stage' }), h('div', { class: 'foot' }, h('span', {}, S.foot), h('span', { class: 'cnt' }, `${i + 1} / ${SLIDES.length}`)))));
  const tabs = $('#tabs'); SLIDES.forEach((S, i) => tabs.append(h('button', { role: 'tab', onclick: `goSlide(${i})` }, `${i + 1}. ${S.name}`)));
  document.body.append(h('div', { id: 'stepdots', title: 'build steps: space or → to reveal the next one' }));
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const i = $$('section.slide').indexOf(e.target);
    $$('#tabs button').forEach((b, j) => b.setAttribute('aria-selected', String(j === i))); if (i !== DECK.cur || DECK.steps.length === 0 || !DECK.started) { DECK.started = true; const m = DECK.mode; DECK.mode = 'first'; if (m === 'final') showFinal(i); else { mountSlide(i); advance(); } } } }), { threshold: .6 });
  $$('section.slide').forEach(sct => io.observe(sct));
  DECK.short = /[?&]short\b/.test(location.search); document.body.classList.toggle('short', DECK.short);
  document.body.append(h('div', { id: 'shortmode' }, 'short version · s to switch'));
  addEventListener('keydown', e => { if (e.key === 's') { DECK.short = !DECK.short; document.body.classList.toggle('short', DECK.short); showFinal(DECK.cur); return; } if (['ArrowRight', ' ', 'Enter', 'PageDown', 'ArrowDown'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); } });
  $('#deck').addEventListener('click', e => { if (e.target.closest('button,select,a,.tchip')) return; if (e.clientX < innerWidth * .2) prev(); else next(); });
  const nav = h('div', { id: 'navbtns' }, h('button', { 'aria-label': 'Back', onclick: 'prev()' }, '‹'), h('button', { 'aria-label': 'Next', onclick: 'next()' }, '›'));
  document.body.append(nav);
  window.__show = async (i, k) => { goSlide(i, 'instant'); await new Promise(r => setTimeout(r, 120)); Anim.cancel(); await playTo(i, k); };   // test hook
}

initDeck();
</script></body></html>
