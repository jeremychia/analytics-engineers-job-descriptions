<style>:root{--bg:#fdf1ee;--ink:#2a0a08;--ink2:#7a5a55;--mute:#b79e99;--coral:#ea5b4d;--plum:#5b2a4a;--soft:#f5d6cf;--line:#e9cfc8;--paper:#fff8f6}
*{box-sizing:border-box;margin:0}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif}
.slide{height:100vh;min-height:620px;scroll-snap-align:start;padding:8vh 5vw 5vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.kick{font:12px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
h1{font-size:clamp(30px,4.6vw,68px);line-height:1;letter-spacing:-.03em;font-weight:700;margin-top:1.2vh}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:1.5vh;position:relative}
.stage .chart{width:100%;height:100%;max-height:100%}
.foot{position:absolute;left:calc(5vw + 96px);right:5vw;bottom:2vh;font:11px 'JetBrains Mono',monospace;color:var(--mute);display:flex;justify-content:space-between;gap:24px}
.tabs{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;gap:6px;padding:10px 5vw;overflow-x:auto;scrollbar-width:none;background:linear-gradient(var(--bg) 70%,transparent)}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font:13px 'Space Grotesk',sans-serif;color:var(--ink2);background:var(--paper)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button:focus-visible,.tchip:focus-visible{outline:2px solid var(--coral)}
#stepdots{position:fixed;right:2vw;bottom:3vh;display:flex;gap:6px;z-index:9}
#stepdots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block;transition:background .3s,transform .3s}
#stepdots i.on{background:var(--coral);transform:scale(1.25)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:13px;display:none;z-index:30;max-width:260px}
svg text{font-family:'Space Grotesk',sans-serif}
.lbl{font-size:14px;fill:var(--ink2);font-weight:500}.tick{font:12px 'JetBrains Mono',monospace;fill:var(--mute)}
.rowlab{font-size:17px;font-weight:700;fill:var(--ink)}.rowlab2{font-size:13px;fill:var(--ink2);font-weight:500}.rowsub{font-size:13px;fill:var(--ink2)}
.bignum{font-size:56px;font-weight:700;fill:var(--coral);letter-spacing:-.04em}.bignum2{font-size:44px;font-weight:700;fill:var(--ink);letter-spacing:-.03em}
.clname{font-size:16px;font-weight:700;fill:var(--ink)}.clnum{font-size:15px;font-weight:700}
.floater{font-size:13px;fill:var(--ink2);animation:drift 7s ease-in-out infinite alternate;transition:opacity .6s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(14px,-10px)}}
.barnum{font-size:26px;font-weight:700;fill:#fff}.chip{font-size:15px;font-weight:500;fill:var(--ink)}
.cardlab{font:700 13px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;fill:var(--ink2)}
.cardq{font-size:24px;line-height:1.2;letter-spacing:-.015em;font-weight:500;color:var(--ink);font-family:'Space Grotesk'}
.cardask{font-size:20px;font-weight:700}.adj{font-size:20px;font-weight:700;fill:var(--ink)}.bigline{font-size:34px;font-weight:700;fill:var(--ink);letter-spacing:-.02em}
.ladnum{font-size:46px;font-weight:700;fill:var(--ink);letter-spacing:-.03em}.ladnum2{font-size:30px;font-weight:700;fill:var(--ink)}
.frco{font-size:15px;font-weight:700;fill:var(--ink)}.frtick{font-size:11px;font-weight:700}
.endlab{font-size:13px;font-weight:700}.delta{font-size:16px;font-weight:700}.colhead{font-size:13px;font-weight:700;fill:var(--ink)}.cellnum{font-size:12px;font-weight:700}

.ctr .tag{display:inline-block;margin-top:2px}
.col{width:100%;max-width:920px;display:flex;flex-direction:column;gap:3vh}
.adcard{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:2.4vh 2vw}
.adlab{font:12px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:1.6vh}
.adline{display:flex;gap:16px;align-items:baseline;font-size:clamp(17px,2vw,30px);line-height:1.25;letter-spacing:-.01em;padding:1vh 0;transition:opacity .4s}
.tag{font:700 11px 'JetBrains Mono',monospace;letter-spacing:.1em;padding:3px 9px;border-radius:999px;flex:none}
.tag.say{background:var(--soft);color:var(--ink)}.tag.ask{background:var(--plum);color:#fff}
mark.m-say{background:linear-gradient(transparent 62%,var(--coral) 62%,var(--coral) 90%,transparent 90%);color:inherit}
mark.m-ask{background:var(--plum);color:#fff;padding:0 6px;border-radius:5px}
.ruler{width:100%;height:auto;max-height:22vh;transition:opacity .5s}.ruler .lbl{font-size:15px}.pinl{font-size:15px;font-weight:700;fill:#fff;transform:translateY(-3px)}

.bcov{position:absolute;left:0;top:0;width:560px;height:560px;pointer-events:none}

/* The ladder as two slope charts: the core stays flat, the verbs climb. Real prevalence by level (classifier ladder). */
function buildLadder(stage) {

    const g = s('g', { style: { opacity: 0 } }, svg), pw = 330, y0 = 90, ph = 300, X = i => x0 + 20 + i * (pw - 20) / 3, Y = v => y0 + ph - v / 100 * ph;
    s('text', { x: x0, y: 52, class: 'cardlab', text: title }, g);
    [0, 25, 50, 75, 100].forEach(v => { s('line', { x1: x0 + 10, x2: x0 + pw + 8, y1: Y(v), y2: Y(v), stroke: C.line, 'stroke-width': v ? .8 : 1.6 }, g);
      s('text', { x: x0 - 2, y: Y(v) + 4, 'text-anchor': 'end', class: 'tick', text: v ? v + '%' : '' }, g); });
    lv.forEach((l, i) => s('text', { x: X(i), y: y0 + ph + 26, 'text-anchor': 'middle', class: 'tick', text: l }, g));
    const paths = items.map(([key, label, color]) => { const v = core[key]; const d = v.map((p, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(p)).join(' ');
      const p = s('path', { d, fill: 'none', stroke: color, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
      const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      const dots = v.map((q, i) => { const c = s('circle', { cx: X(i), cy: Y(q), r: 5, fill: color, stroke: C.bg, 'stroke-width': 2, style: { opacity: 0 } }, g); return c; });
      const lab = s('text', { x: X(3) + 12, y: Y(v[3]) + 4, class: 'endlab', text: label, style: { fill: color, opacity: 0 } }, g);
      return { p, len, dots, lab, v }; });
    const ord = paths.slice().sort((a, b) => b.v[3] - a.v[3]); let last = -1e9;      // top to bottom, at least 17px apart
    ord.forEach(o => { let y = Y(o.v[3]) + 4; if (y - last < 17) y = last + 17; o.lab.setAttribute('y', y); last = y; });

    ['THEME: Data Quality & Testing', 'tests on data', C.teal], ['THEME: Stakeholder Collaboration & Requirements', 'stakeholders', C.amber]], C.plum);
  const right = panel(540, 'The verb: what changes', [['SCOPE: support / assist', '“support”', C.mute], ['SCOPE: own', '“own”', C.blue], ['Mentoring / coaching / code review', 'mentor', C.teal],

  const fr = s('g', { style: { opacity: 0 } }, svg);
  s('rect', { x: 520, y: 456, width: 450, height: 62, rx: 14, fill: C.paper, stroke: C.line }, fr);
  s('text', { x: 540, y: 482, class: 'rowlab', text: 'In France (94 ads) the same direction' }, fr);
  s('text', { x: 540, y: 504, class: 'rowsub', text: 'more mentoring and “piloter” in senior ads; years about 3 then 5' }, fr);

/* Pitch yourself: 945 ads on the duty-by-stack map. Toggle your tools; the ads that name only tools you have light up. */
function buildPitch(stage, opts = {}) {
  const P = D.pitch, ads = P.ads, T = D.tools, W = 640, H = 540;
  const wrap = h('div', { class: 'pitch' }); stage.append(wrap);
  const left = h('div', { class: 'pmap' }), right = h('div', { class: 'ppanel' }); wrap.append(left, right);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart' }, left);
  const xs = ads.map(a => a[0]).sort((a, b) => a - b), ys = ads.map(a => a[1]).sort((a, b) => a - b);
  const q = (arr, p) => arr[Math.floor(p * (arr.length - 1))], x0 = q(xs, .01), x1 = q(xs, .99), y0 = q(ys, .01), y1 = q(ys, .99);
  const X = v => 40 + (Math.min(x1, Math.max(x0, v)) - x0) / (x1 - x0) * (W - 70), Y = v => H - 50 - (Math.min(y1, Math.max(y0, v)) - y0) / (y1 - y0) * (H - 90);
  s('text', { x: 40, y: H - 14, class: 'tick', text: '← BI and reporting' }, svg);
  s('text', { x: W - 30, y: H - 14, 'text-anchor': 'end', class: 'tick', text: 'modelling, pipelines, warehouse →' }, svg);
  s('text', { x: 14, y: H - 50, class: 'tick', transform: `rotate(-90 14 ${H - 50})`, text: 'Power BI · Azure · Fabric ↔ dbt · Snowflake · BigQuery' }, svg);
  const rr = rng(4), g = s('g', {}, svg);
  const dots = ads.map(a => { const c = s('circle', { cx: X(a[0]) + (rr() - .5) * 4, cy: Y(a[1]) + (rr() - .5) * 4, r: 0, fill: C.grey }, g);
    c.addEventListener('mousemove', e => tip.show(e, `<b>${a[5]}</b>`)); c.addEventListener('mouseleave', () => tip.hide()); return c; });
  const mine = new Set(), toolPop = ads.reduce((o, a) => { T.forEach((t, k) => o[k] = (o[k] || 0) + ((a[2] >> k) & 1)); return o; }, {});
  const lvl = h('select', { class: 'sel' }, ['any level', 'junior', 'mid', 'senior', 'lead+'].map((l, i) => h('option', { value: i - 1 }, l)));
  const reg = h('select', { class: 'sel' }, [h('option', { value: '' }, 'any region'), ...P.regions.map(r => h('option', { value: r }, r))]);
  const chips = h('div', { class: 'chips' }), out = h('div', { class: 'pout' });
  const chipEls = T.map((t, k) => { const c = h('button', { class: 'tchip', 'aria-pressed': 'false' }, t); c.onclick = () => { toggle(k); }; chips.append(c); return c; });
  right.append(h('div', { class: 'plab' }, 'Your tools'), chips, h('div', { class: 'psel' }, lvl, reg), out);
  let live = false;
  function toggle(k, on) { const want = on ?? !mine.has(k); if (want) mine.add(k); else mine.delete(k); chipEls[k].setAttribute('aria-pressed', String(want)); update(); }
  function update() {
    const L = +lvl.value, R = reg.value; let mask = 0; mine.forEach(k => mask |= 1 << k);
    const sel = ads.map(a => (L < 0 || a[3] === L) && (!R || a[4] === R) && a[2] !== 0);
    const pool = sel.filter(Boolean).length; let match = 0, near = 0, exact = 0; const miss = {};
    ads.forEach((a, i) => { const el = dots[i]; if (!sel[i]) { el.style.fill = C.line; el.style.opacity = .35; el.setAttribute('r', 2.2); return; }
      const m = a[2] & ~mask, nm = popcount(m);
      if (a[2] === mask && mask) exact++;
      if (mask && nm === 0) { match++; el.style.fill = C.coral; el.style.opacity = 1; el.setAttribute('r', 5); }
      else if (mask && nm === 1) { near++; const k = Math.log2(m); miss[k] = (miss[k] || 0) + 1; el.style.fill = C.amber; el.style.opacity = .9; el.setAttribute('r', 3.8); }
      else { el.style.fill = C.grey; el.style.opacity = .75; el.setAttribute('r', 2.8); } });
    const gaps = Object.entries(miss).sort((a, b) => b[1] - a[1]).slice(0, 3);
    if (!mask) { out.innerHTML = '<div class="phint">Pick the tools you use. Ads that name only tools you have turn coral.</div>'; return; }
    out.innerHTML = `<div class="bigstat"><span>${pct(match, pool)}%</span></div><div class="lbl2">${match} of ${pool} ads name only tools you have</div>
      <div class="pgap"><b>Closest gaps</b> (one tool away, ${near} ads): ${gaps.length ? gaps.map(([k, n]) => `${T[k]} +${n}`).join(' · ') : 'none'}</div>
      <div class="pgap">${exact ? `Your exact combination appears in <b>${exact}</b> ad${exact > 1 ? 's' : ''}${exact <= 2 ? ': a niche. Pitch it.' : '.'}` : 'No ad names exactly your combination: a niche. Pitch it.'}</div>`;
  }
  const popcount = v => { let c = 0; while (v) { c += v & 1; v >>= 1; } return c; };
  lvl.onchange = reg.onchange = update;
  const demo = [0, 1, 2, 5, 16];  // SQL, Python, dbt, Snowflake, Git
  const reset = () => { mine.clear(); chipEls.forEach(c => c.setAttribute('aria-pressed', 'false')); lvl.value = -1; reg.value = ''; update(); };
  const steps = [
    async () => { reset(); dots.forEach((c, i) => { c.style.transition = 'fill .4s, opacity .4s, r .4s'; later(() => c.setAttribute('r', 2.8), Anim.fast ? 0 : (i % 200) * 5); }); await wait(Anim.fast ? 0 : 1300);
      out.innerHTML = `<div class="phint"><b>${ads.length}</b> ads, one dot each. Left to right: from reporting to modelling. Bottom to top: from the Microsoft stack to dbt and warehouses.</div>`; },
    async () => { for (const k of demo) { toggle(k, true); if (!(await wait(Anim.fast ? 0 : 900))) return; } },
    async () => { lvl.value = 1; update(); await wait(300); out.insertAdjacentHTML('beforeend', '<div class="phint">Now try your own: toggle tools, pick a level and a region.</div>'); }
  ];
  return steps;
}

    'Security, Privacy & Risk': 'Security & risk', 'Vendor & Tooling Evaluation': 'Vendor evaluation', 'Data Quality & Testing': 'Data quality & testing', 'Mentorship & Leadership': 'Mentorship & leadership',
    'Data Ownership (end-to-end)': 'End-to-end ownership', 'AI & Agentic Workflows': 'AI & agentic workflows', 'BI & Reporting/Dashboards': 'BI & reporting' }[t] || t);
  [-.04, 0, .04, .08, .12].forEach(v => { s('line', { x1: X(v), x2: X(v), y1: 56, y2: 505, stroke: v ? C.line : C.mute }, svg); s('text', { x: X(v), y: 526, 'text-anchor': 'middle', class: 'tick', text: (v > 0 ? '+' : '') + Math.round(v * 100) + ' pts' }, svg); });
  s('text', { x: X(0) - 10, y: 36, 'text-anchor': 'end', class: 'lbl', text: '← more in dbt + warehouse ads' }, svg); s('text', { x: X(0) + 10, y: 36, class: 'lbl', text: 'more in Power BI / Fabric ads →' }, svg);
  const rows = idx.map((i, k) => { const y = 74 + k * 27, sig = G.holm[i] < .05, big = G.themes[i].startsWith('BI &');
    s('text', { x: L - 14, y: y + 5, 'text-anchor': 'end', class: sig ? 'rowlab2 sig' : 'rowlab2', text: short(G.themes[i]), style: { fill: sig ? C.ink : C.ink2, fontWeight: sig ? 700 : 500 } }, svg);
    const bar = s('line', { x1: X(0), x2: X(0), y1: y, y2: y, stroke: sig ? C.coral : C.mute, 'stroke-width': big ? 5 : 3, 'stroke-linecap': 'round' }, svg);
    const dot = s('circle', { cx: X(0), cy: y, r: big ? 9 : 6, fill: sig ? C.coral : C.bg, stroke: sig ? C.bg : C.mute, 'stroke-width': 2 }, svg);
    const hit = s('rect', { x: 0, y: y - 12, width: W, height: 24, fill: 'transparent' }, svg);
    hit.addEventListener('mousemove', e => tip.show(e, `<b>${G.themes[i]}</b><br>gap ${(G.mean[i] * 100).toFixed(1)} pts (${(G.lo[i] * 100).toFixed(1)} to ${(G.hi[i] * 100).toFixed(1)})<br>Holm p ${G.holm[i].toExponential(1)}`)); hit.addEventListener('mouseleave', () => tip.hide());
    return { i, bar, dot, k }; });
  return [async () => { await Promise.all(rows.map(({ i, bar, dot, k }) => tween(1100, e => { const m = X(G.mean[i] * e), a = X(G.lo[i] * e), b = X(G.hi[i] * e);
    dot.setAttribute('cx', m); bar.setAttribute('x1', a); bar.setAttribute('x2', b); }, { delay: k * 70, ease: E.out }))); }];
}

/* Slide metadata shared by the deck and the explorer. */
const SLIDES = [
  { id: 'open', name: 'The ad', title: 'What it says. <em>What it asks.</em>', kick: 'One real ad', foot: 'Verbatim from the ad (Enhance, Dubai), including its next sentence about internships. Median ask in junior ads that state years: 1 year.', build: st => buildAdSlide(st, false) },

/* Deck runtime: sections, steps (Space/Right/Enter build, Left unbuild), pills, progress, replay on entry. */
const DECK = { cur: 0, step: 0, steps: [], busy: false };
function mountSlide(i) {
  const sec = $$('section.slide')[i], stage = $('.stage', sec);
  Anim.cancel(); Anim.fast = false; stage.innerHTML = ''; tip.hide();
  DECK.steps = SLIDES[i].build(stage); DECK.step = 0; DECK.cur = i; updateDots();
}
async function playTo(i, k) {            // rebuild slide i and run steps up to (and including) k-1 instantly, then animate step k-1 if animate
  mountSlide(i); Anim.fast = true;
  for (let j = 0; j < k - 1; j++) { await DECK.steps[j](); }
  Anim.fast = false; DECK.step = k - 1; await advance(true);
}
async function advance(first) {
  if (DECK.step >= DECK.steps.length) return false;
  const k = DECK.step; DECK.step++; updateDots();
  await DECK.steps[k]();
  return true;
}
function updateDots() { const d = $('#stepdots'); if (!d) return; d.innerHTML = ''; for (let k = 0; k < DECK.steps.length; k++) d.append(h('i', { class: k < DECK.step ? 'on' : '' })); }
function goSlide(i, behavior = 'smooth', mode = 'first') { i = Math.max(0, Math.min(SLIDES.length - 1, i)); DECK.mode = mode; $$('section.slide')[i].scrollIntoView({ behavior }); }
async function next() {
  if (DECK.step < DECK.steps.length) { await advance(); return; }
  if (DECK.cur < SLIDES.length - 1) goSlide(DECK.cur + 1);
}
async function prev() {
  if (DECK.step > 1) { Anim.cancel(); await playTo(DECK.cur, DECK.step - 1); return; }
  if (DECK.cur > 0) goSlide(DECK.cur - 1, 'smooth', 'final');   // previous slide, as you left it; keep pressing back to unbuild it
}
async function showFinal(i) {              // mount slide i with every step already shown
  mountSlide(i); Anim.fast = true;
  for (let j = 0; j < DECK.steps.length; j++) { DECK.step = j + 1; await DECK.steps[j](); }
  Anim.fast = false; updateDots();
}
function initDeck() {
  const main = $('#deck');
  SLIDES.forEach((S, i) => main.append(h('section', { class: 'slide', id: 's-' + S.id },
    h('div', { class: 'kick' }, S.kick), h('h1', { html: S.title }), h('div', { class: 'stage' }), h('div', { class: 'foot' }, h('span', {}, S.foot), h('span', { class: 'cnt' }, `${i + 1} / ${SLIDES.length}`)))));
  const tabs = $('#tabs'); SLIDES.forEach((S, i) => tabs.append(h('button', { role: 'tab', onclick: `goSlide(${i})` }, `${i + 1}. ${S.name}`)));
  document.body.append(h('div', { id: 'stepdots', title: 'build steps: space or → to reveal the next one' }));
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const i = $$('section.slide').indexOf(e.target);
    $$('#tabs button').forEach((b, j) => b.setAttribute('aria-selected', String(j === i))); if (i !== DECK.cur || DECK.steps.length === 0 || !DECK.started) { DECK.started = true; const m = DECK.mode; DECK.mode = 'first'; if (m === 'final') showFinal(i); else { mountSlide(i); advance(); } } } }), { threshold: .6 });
  $$('section.slide').forEach(sct => io.observe(sct));
  addEventListener('keydown', e => { if (['ArrowRight', ' ', 'Enter', 'PageDown', 'ArrowDown'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); } });
  $('#deck').addEventListener('click', e => { if (e.target.closest('button,select,a,.tchip')) return; if (e.clientX < innerWidth * .2) prev(); else next(); });
  const nav = h('div', { id: 'navbtns' }, h('button', { 'aria-label': 'Back', onclick: 'prev()' }, '‹'), h('button', { 'aria-label': 'Next', onclick: 'next()' }, '›'));
  document.body.append(nav);
  window.__show = async (i, k) => { goSlide(i, 'instant'); await new Promise(r => setTimeout(r, 120)); Anim.cancel(); await playTo(i, k); };   // test hook
}

initDeck();
